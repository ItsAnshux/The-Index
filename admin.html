<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivist — The Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="topbar">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="mark">Ⅰ</span> The Index</a>
    <div class="navlinks">
      <a href="index.html">Directory</a>
      <a href="submit.html">Submit</a>
      <a href="community.html">Whispers</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Restricted</div>
    <h1>Archivist's desk.</h1>
    <p class="lead">Yahan se pending entries approve/reject karo aur whispers moderate karo.</p>
  </div>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <form class="card" id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <div class="status-msg" id="loginMsg"></div>
  </form>

  <!-- DASHBOARD (hidden until login) -->
  <div id="dashboard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
      <span class="mono" style="font-size:13px; color:var(--muted);" id="whoami"></span>
      <button class="btn btn-ghost" id="logoutBtn">Sign out</button>
    </div>

    <div class="section-label">Pending entries</div>
    <div id="pendingQueue"><div class="empty">Loading…</div></div>

    <div class="section-label">Approved entries</div>
    <div id="approvedQueue"><div class="empty">Loading…</div></div>

    <div class="section-label">Whispers (moderation)</div>
    <div id="whisperQueue"><div class="empty">Loading…</div></div>
  </div>

</div>

<footer>
  Kept by patrons, stamped by the Archivist.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/app.js"></script>
<script>
const loginForm = document.getElementById("loginForm");
const dashboard = document.getElementById("dashboard");

async function checkSession() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) {
    showDashboard(data.session.user.email);
  }
}

function showDashboard(email) {
  loginForm.style.display = "none";
  dashboard.style.display = "block";
  document.getElementById("whoami").textContent = `Signed in as ${email}`;
  loadPending();
  loadApproved();
  loadWhispers();
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("loginMsg");
  btn.disabled = true; btn.textContent = "Signing in…";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });

  if (error) {
    msg.classList.add("show", "err"); msg.classList.remove("ok");
    msg.textContent = "Login fail — email/password check karo.";
    btn.disabled = false; btn.textContent = "Sign in";
  } else {
    showDashboard(data.user.email);
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  location.reload();
});

async function loadPending() {
  const { data, error } = await supabaseClient
    .from("websites").select("*").eq("status", "pending")
    .order("created_at", { ascending: true });
  const el = document.getElementById("pendingQueue");
  if (error) { el.innerHTML = `<div class="empty">Load error.</div>`; return; }
  if (!data.length) { el.innerHTML = `<div class="empty">Koi pending request nahi.</div>`; return; }
  el.innerHTML = data.map(e => `
    <div class="queue-item">
      <div class="queue-info">
        <span class="badge pending">Pending</span>
        <div class="entry-name" style="margin-top:6px;">${escapeHtml(e.name)}</div>
        <div class="entry-domain">${escapeHtml(e.url)}</div>
        <div class="entry-desc">${escapeHtml(e.description || "")} — <span class="tag">${escapeHtml(e.category)}</span></div>
      </div>
      <div class="queue-actions">
        <button class="btn" data-approve="${e.id}">Approve</button>
        <button class="btn btn-danger" data-reject="${e.id}">Reject</button>
      </div>
    </div>
  `).join("");

  el.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", () => updateStatus(b.dataset.approve, "approved")));
  el.querySelectorAll("[data-reject]").forEach(b => b.addEventListener("click", () => updateStatus(b.dataset.reject, "rejected")));
}

async function updateStatus(id, status) {
  await supabaseClient.from("websites").update({ status }).eq("id", id);
  loadPending(); loadApproved();
}

async function loadApproved() {
  const { data, error } = await supabaseClient
    .from("websites").select("*").eq("status", "approved")
    .order("created_at", { ascending: false });
  const el = document.getElementById("approvedQueue");
  if (error) { el.innerHTML = `<div class="empty">Load error.</div>`; return; }
  if (!data.length) { el.innerHTML = `<div class="empty">Abhi koi approved entry nahi.</div>`; return; }
  el.innerHTML = data.map(e => `
    <div class="queue-item">
      <div class="queue-info">
        <span class="badge approved">Approved</span>
        <div class="entry-name" style="margin-top:6px;">${escapeHtml(e.name)}</div>
        <div class="entry-domain">${escapeHtml(e.url)}</div>
      </div>
      <div class="queue-actions">
        <button class="btn btn-danger" data-remove="${e.id}">Remove</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", async () => {
    await supabaseClient.from("websites").delete().eq("id", b.dataset.remove);
    loadApproved();
  }));
}

async function loadWhispers() {
  const { data, error } = await supabaseClient
    .from("whispers").select("*").order("created_at", { ascending: false }).limit(100);
  const el = document.getElementById("whisperQueue");
  if (error) { el.innerHTML = `<div class="empty">Load error.</div>`; return; }
  if (!data.length) { el.innerHTML = `<div class="empty">Koi whisper nahi.</div>`; return; }
  el.innerHTML = data.map(w => `
    <div class="queue-item">
      <div class="queue-info">
        <div class="whisper-meta"><span>${escapeHtml(w.patron_name)}</span><span class="time">${timeAgo(w.created_at)}</span></div>
        <div class="whisper-content">${escapeHtml(w.content)}</div>
      </div>
      <div class="queue-actions">
        <button class="btn btn-danger" data-del="${w.id}">Delete</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    await supabaseClient.from("whispers").delete().eq("id", b.dataset.del);
    loadWhispers();
  }));
}

checkSession();
</script>
</body>
</html>
